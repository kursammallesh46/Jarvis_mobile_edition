<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:18px; background:radial-gradient(circle at top,#08121f,#000 70%); color:#0ff; font-family:'Orbitron',monospace; min-height:100vh; }
  h1 { text-align:center; margin:6px 0 2px; font-size:28px; letter-spacing:6px; text-shadow:0 0 14px #0ff; }
  .sub { text-align:center; font-size:9px; letter-spacing:4px; opacity:.6; }
  .orb-wrap { display:flex; justify-content:center; margin:22px 0 10px; }
  .orb { width:170px; height:170px; border-radius:50%; border:2px solid #0ff; box-shadow:0 0 25px #0ff, inset 0 0 25px #0ff; display:flex; align-items:center; justify-content:center; animation:spin 8s linear infinite; }
  .ring { width:130px; height:130px; border-radius:50%; border:2px solid #0aa; display:flex; align-items:center; justify-content:center; }
  .core { width:70px; height:70px; border-radius:50%; background:#0ff; box-shadow:0 0 30px #0ff; animation:pulse 2s ease-in-out infinite; }
  .orb.listen .core { background:#0f0; box-shadow:0 0 35px #0f0; animation-duration:.6s; }
  .orb.think .core { background:#ff0; box-shadow:0 0 35px #ff0; animation-duration:.4s; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
  @keyframes spin { to{transform:rotate(360deg);} }
  #state { text-align:center; font-size:12px; letter-spacing:4px; margin-bottom:16px; }
  .panel { border:1px solid #0a6; background:rgba(0,40,40,.35); padding:12px; margin-bottom:14px; border-radius:4px; }
  .panel h3 { margin:0 0 8px; font-size:13px; letter-spacing:2px; }
  .row { display:flex; justify-content:space-between; font-size:10px; margin:4px 0; }
  .row b { color:#0f0; }
  #log { height:190px; overflow-y:auto; font-family:Arial,sans-serif; font-size:13px; }
  #log div { background:rgba(0,60,60,.35); border-left:3px solid #0ff; padding:7px 9px; margin-bottom:6px; color:#dff; word-wrap:break-word; }
  #log a { display:inline-block; margin-top:6px; padding:8px 12px; background:#0f0; color:#000; font-weight:bold; text-decoration:none; }
  select, input[type=text] { width:100%; background:#001; border:1px solid #0ff; color:#0ff; padding:12px; font-size:14px; margin-bottom:8px; font-family:Arial,sans-serif; }
  .btns { display:flex; gap:8px; margin-bottom:8px; }
  button { flex:1; padding:13px 4px; background:#0ff; color:#000; border:0; font-family:'Orbitron',monospace; font-weight:700; font-size:11px; letter-spacing:1px; }
  button.small { flex:0 0 52px; font-size:18px; }
  #hf { width:100%; background:#ff0; }
</style>
</head>
<body>
  <h1>J.A.R.V.I.S</h1>
  <div class="sub">PERSONAL AI ASSISTANT</div>

  <div class="orb-wrap"><div class="orb" id="orb"><div class="ring"><div class="core"></div></div></div></div>
  <div id="state">SYSTEM READY</div>

  <div class="panel">
    <h3>SYSTEM DIAGNOSTICS</h3>
    <div class="row"><span>AI ENGINE</span><b>● OPERATIONAL</b></div>
    <div class="row"><span>CONNECTION</span><b>● ONLINE</b></div>
    <div class="row"><span>VOICE INTERFACE</span><b>● READY</b></div>
    <div class="row"><span>LONG-TERM MEMORY</span><b>● ACTIVE</b></div>
  </div>

  <div class="panel"><div id="log"></div></div>

  <select id="lang">
    <option value="en-IN">English</option>
    <option value="te-IN">Telugu</option>
  </select>
  <input type="text" id="cmd" placeholder="Enter a command for J.A.R.V.I.S.">
  <div class="btns">
    <button id="exec">EXECUTE</button>
    <button class="small" id="mic">🎤</button>
    <button class="small" id="cam">📷</button>
    <button id="clear">CLEAR MEMORY</button>
  </div>
  <button id="hf">🎧 HANDS-FREE: OFF</button>
  <input type="file" id="file" accept="image/*" capture="environment" style="display:none">

<script>
const MODEL = "gemini-3.5-flash";
const $ = (id) => document.getElementById(id);
const APPS = {
  "whatsapp":"com.whatsapp", "instagram":"com.instagram.android", "snapchat":"com.snapchat.android",
  "telegram":"org.telegram.messenger", "spotify":"com.spotify.music", "youtube":"com.google.android.youtube",
  "phonepe":"com.phonepe.app", "google pay":"com.google.android.apps.nbu.paisa.user",
  "maps":"com.google.android.apps.maps", "gmail":"com.google.android.gm", "facebook":"com.facebook.katana"
};

let history = JSON.parse(localStorage.getItem("jarvis_mem") || "[]");
let pendingApp = null;
let busy = false;
let handsFree = false;
let rec = null;

function saveMem() { localStorage.setItem("jarvis_mem", JSON.stringify(history.slice(-30))); }

function setState(t, cls) {
  $("state").textContent = t;
  $("orb").className = "orb " + (cls || "");
}

function addLog(who, text, link) {
  const d = document.createElement("div");
  d.textContent = who + ": " + text;
  if (link) {
    const a = document.createElement("a");
    a.href = link.url;
    a.textContent = "👉 TAP TO OPEN " + link.name.toUpperCase();
    d.appendChild(document.createElement("br"));
    d.appendChild(a);
  }
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

function getKey() {
  let k = localStorage.getItem("jarvis_key");
  if (!k) {
    k = (prompt("Paste your Gemini API key (saved only in this browser):") || "").trim();
    if (k) localStorage.setItem("jarvis_key", k);
  }
  return k;
}

function speak(text) {
  return new Promise((resolve) => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = $("lang").value;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function handleCommand(t) {
  t = t.toLowerCase();
  t = t.replace(/(\d)\s+(?=\d)/g, "$1");

  if (t.includes("open ")) {
    for (const name in APPS) {
      if (t.includes(name)) {
        pendingApp = { name, url: "intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=" + APPS[name] + ";end" };
        return "Opening " + name + ", Boss.";
      }
    }
  }
  const num = t.replace(/\s/g, "").match(/call(\d{10})/);
  if (num) { pendingApp = { name: "call", url: "tel:" + num[1] }; return "Calling " + num[1]; }

  const wa = t.match(/whatsapp\s*(\d{10})\s+(.+)/);
  if (wa) {
    pendingApp = { name: "WhatsApp chat", url: "https://wa.me/91" + wa[1] + "?text=" + encodeURIComponent(wa[2]) };
    return "Opening WhatsApp chat";
  }
  if (t.startsWith("search ")) {
    const q = t.replace("search ", "");
    pendingApp = { name: "google", url: "https://google.com/search?q=" + encodeURIComponent(q) };
    return "Searching " + q;
  }
  if (t.startsWith("play ")) {
    const q = t.replace("play ", "").replace(" on youtube", "");
    pendingApp = { name: "youtube", url: "https://youtube.com/results?search_query=" + encodeURIComponent(q) };
    return "Playing " + q;
  }
  if (t.includes("time")) return "It is " + new Date().toLocaleTimeString();
  if (t.includes("date") || t.includes("today")) return "Today is " + new Date().toDateString();
  return null;
}

async function askGemini(text, image) {
  const key = getKey();
  if (!key) return "API key pettu macha!";
  const parts = [{ text }];
  if (image) parts.push({ inlineData: { mimeType: image.type, data: image.data } });
  history.push({ role: "user", parts: [{ text }] });
  try {
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent",
      {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: "You are J.A.R.V.I.S, a smart assistant. Call the user Boss. Keep answers short. Reply in the same language the user speaks." }] },
          contents: history.slice(0, -1).concat([{ role: "user", parts }])
        })
      }
    );
    const data = await res.json();
    if (data.error) { history.pop(); return "Error: " + data.error.message; }
    const reply = data.candidates[0].content.parts[0].text;
    history.push({ role: "model", parts: [{ text: reply }] });
    saveMem();
    return reply;
  } catch (e) {
    history.pop();
    return "Error: " + e.message;
  }
}

async function run(text, image) {
  if (!text || busy) return;
  busy = true;
  $("cmd").value = "";
  addLog("YOU", text);
  setState("PROCESSING", "think");
  let reply = image ? null : handleCommand(text);
  if (!reply) reply = await askGemini(text, image);
  addLog("J.A.R.V.I.S", reply, pendingApp);
  pendingApp = null;
  setState("SPEAKING", "listen");
  await speak(reply);
  setState("SYSTEM READY");
  busy = false;
  if (handsFree) startRec();
}

$("exec").onclick = () => run($("cmd").value.trim());
$("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") $("exec").click(); });

$("clear").onclick = () => {
  history = [];
  localStorage.removeItem("jarvis_mem");
  $("log").innerHTML = "";
  addLog("J.A.R.V.I.S", "Memory cleared, Boss.");
};

// voice + wake word
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function startRec() {
  if (!rec || busy) return;
  try {
    rec.lang = $("lang").value;
    rec.start();
    if (handsFree) setState("SAY 'JARVIS'...", "listen");
  } catch (e) {}
}

if (!SR) {
  $("mic").disabled = true;
  $("hf").disabled = true;
} else {
  rec = new SR();
  rec.onresult = (e) => {
    const t = e.results[0][0].transcript;
    if (!handsFree) return run(t);
    if (!/jarvis|జార్విస్/i.test(t)) return;
    const cmd = t.replace(/jarvis|జార్విస్/ig, "").trim();
    if (cmd) run(cmd);
    else {
      busy = true;
      speak("Yes Boss?").then(() => { busy = false; startRec(); });
    }
  };
  rec.onend = () => {
    if (handsFree && !busy) setTimeout(startRec, 300);
    else if (!busy) setState("SYSTEM READY");
  };
  rec.onerror = (e) => {
    if (e.error !== "no-speech" && e.error !== "aborted") setState("MIC ERROR: " + e.error);
  };

  $("mic").onclick = () => {
    handsFree = false;
    $("hf").textContent = "🎧 HANDS-FREE: OFF";
    speechSynthesis.cancel();
    setState("LISTENING", "listen");
    startRec();
  };

  $("hf").onclick = () => {
    handsFree = !handsFree;
    $("hf").textContent = handsFree ? "🎧 HANDS-FREE: ON" : "🎧 HANDS-FREE: OFF";
    if (handsFree) startRec();
    else { try { rec.stop(); } catch (e) {} setState("SYSTEM READY"); }
  };
}

// camera
$("cam").onclick = () => $("file").click();
$("file").onchange = () => {
  const f = $("file").files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const data = reader.result.split(",")[1];
    run($("cmd").value.trim() || "Describe this image briefly.", { type: f.type, data });
  };
  reader.readAsDataURL(f);
  $("file").value = "";
};

addLog("J.A.R.V.I.S", "Hello Boss! Waiting for your command.");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
